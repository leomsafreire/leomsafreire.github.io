# -----------------------------------------------------------------------------
# Jekyll
# -----------------------------------------------------------------------------

markdown: kramdown
kramdown:
  input: GFM

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll/scholar
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  # Every spelling of your own name that appears in papers.bib, so the
  # template can highlight it in the author lists.
  last_name: [Sá-Freire]
  first_name: ["Leo M.", "Leo", "L. M."]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true

  query: "@*"
  group_by: year
  group_order: descending

# Bibtex keys used internally by the template, hidden from the rendered output.
filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric]
