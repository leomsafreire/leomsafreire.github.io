{%- capture site_name %}{% include name.html %}{% endcapture -%}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.url != '/' and page.title %}{{ page.title }} · {{ site_name }}{% else %}{{ site_name }}{% endif %}</title>

<meta name="author" content="{{ site_name }}">
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description | strip_newlines | strip }}{% endif %}">
{%- if site.keywords %}
<meta name="keywords" content="{{ site.keywords }}">
{%- endif %}

<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">

{% if site.icon.size <= 4 -%}
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>">
{%- elsif site.icon != blank -%}
<link rel="icon" href="{{ site.icon | prepend: '/assets/img/' | relative_url }}">
{%- endif %}

<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
