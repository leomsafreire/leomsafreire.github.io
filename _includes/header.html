<header class="site-header">
  {%- comment -%}
    On the front page the name is already the <h1>, so the brand is omitted
    here to avoid printing it twice.
  {%- endcomment -%}
  {%- if page.url != '/' %}
  <a class="brand" href="{{ '/' | relative_url }}">{% include name.html %}</a>
  {%- endif %}

  <nav>
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
    <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} aria-current="page"{% endif %}>Publications</a>
  </nav>
</header>
