---
layout: default
---

{%- capture site_name %}{% include name.html %}{% endcapture -%}

<h1 class="name">{{ site_name }}</h1>
{%- if page.subtitle %}
<p class="subtitle">{{ page.subtitle }}</p>
{%- endif %}

{%- if page.profile.image %}
<img class="portrait" src="{{ page.profile.image | prepend: '/assets/img/' | relative_url }}" alt="{{ site_name }}">
{%- endif %}

{{ content }}

{%- if page.links %}
{% include links.html %}
{%- endif %}
